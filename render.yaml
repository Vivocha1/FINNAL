services:
  - type: web
    name: finnal
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /readyz
    autoDeployTrigger: off
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finnal-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: BOOTSTRAP_SECRET
        generateValue: true
      - key: EMPLOYER_MIN_COHORT
        value: "10"

databases:
  - name: finnal-postgres
    databaseName: finnal
    user: finnal_app
    plan: basic-256mb
    region: singapore
    ipAllowList: []